name: Installer Test
permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  test_ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
          DOTFILES_INSTALLER_MODE: test_ci
        run: |
          sudo apt install curl
          curl -fsSL https://raw.githubusercontent.com/shimajiteppei/dotfiles/refs/heads/dotfiles/workspace/dotfiles/install.sh | sh

      - name: Zsh Startup Performance
        shell: sh
        env:
          TERM: xterm-256color
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/workspace/dotfiles"
          mise run zshrc:perf 2>&1 | tee /tmp/zsh-startup-performance.txt
          cat /tmp/zsh-startup-performance.txt >> "$GITHUB_STEP_SUMMARY"

  test_macos-latest:
    runs-on: macos-latest
    steps:
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
          DOTFILES_INSTALLER_MODE: test_ci
        run: |
          brew install curl
          curl -fsSL https://raw.githubusercontent.com/shimajiteppei/dotfiles/refs/heads/dotfiles/workspace/dotfiles/install.sh | sh

      - name: Zsh Startup Performance
        shell: sh
        env:
          TERM: xterm-256color
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/workspace/dotfiles"
          mise run zshrc:perf 2>&1 | tee /tmp/zsh-startup-performance.txt
          cat /tmp/zsh-startup-performance.txt >> "$GITHUB_STEP_SUMMARY"
