name: Installer Test
permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  test_ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
          DOTFILES_INSTALLER_MODE: test_ci
        run: |
          sudo apt install curl
          curl -fsSL https://raw.githubusercontent.com/shimajiteppei/dotfiles/refs/heads/dotfiles/workspace/dotfiles/install.sh | sh

  test_macos-latest:
    runs-on: macos-latest
    steps:
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
          DOTFILES_INSTALLER_MODE: test_ci
        run: |
          brew install curl
          curl -fsSL https://raw.githubusercontent.com/shimajiteppei/dotfiles/refs/heads/dotfiles/workspace/dotfiles/install.sh | sh
