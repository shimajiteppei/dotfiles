name: Installer Test
permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  test_ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
        run: |
          ./workspace/dotfiles/installer.ubuntu_24.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ubuntu-24.04__installer-test-logs
          path: workspace/dotfiles/installer.log
          retention-days: 1
          archive: false

  test_macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - name: Installer Test
        shell: sh
        env:
          TERM: xterm-256color
        run: |
          ./workspace/dotfiles/installer.mac.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-latest__installer-test-logs
          path: workspace/dotfiles/installer.log
          retention-days: 1
          archive: false