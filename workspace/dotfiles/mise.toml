# dotfiles
[tasks."dotfiles:check-xdg"]
run = "$XDG_DATA_HOME/xdg-ninja/xdg-ninja.sh"
description = "check XDG directories"

[tasks."dotfiles:show-tree"]
run = "git ls-tree -dr --name-only HEAD | tree --fromfile"
description = "show directories in git repository"


# zshrc
[tasks."zshrc:perf"]
run = '''
zsh --no-rcs -eo pipefail <<'ZSH'
zmodload zsh/datetime
zmodload zsh/zpty

run_in_pty() {
    local label="$1"
    local command="$2"
    local adjust_by="${3:-0}"
    local output="/tmp/zsh-startup-${label}.out"
    local pty="zsh_startup_${label//[^A-Za-z0-9_]/_}_$$"
    local marker="__ZSH_STARTUP_RC_${label//[^A-Za-z0-9_]/_}__="
    local start="$EPOCHREALTIME"
    local rc=0
    local script
    local output_text
    local chunk
    local timeout="${ZSH_STARTUP_TIMEOUT:-10}"
    local deadline

    : >| "$output"
    script="
        ${command} >| ${(q)output} 2>&1
        rc=\$?
        print -r -- '${marker}'\$rc'__END__'
    "
    zpty "$pty" "TERM=${(q)${TERM:-xterm-256color}} zsh -f -c ${(qqq)script}"

    deadline=$(( EPOCHREALTIME + timeout ))
    while (( EPOCHREALTIME < deadline )); do
        if zpty -r -t "$pty" chunk 2>/dev/null; then
            output_text+="$chunk"
            rc=$(print -rn -- "$output_text" | tr -d '\r' | sed -n "s/^${marker}\\([0-9][0-9]*\\)__END__$/\\1/p" | tail -n 1)
            [[ -n "$rc" ]] && break
        elif ! zpty -t "$pty" 2>/dev/null; then
            break
        fi
        sleep 0.05
    done
    zpty -d "$pty" 2>/dev/null || true

    if [[ -z "$rc" ]]; then
        print -ru2 -- "$label timed out after ${timeout}s"
        [[ -s "$output" ]] && tail -n 40 "$output" >&2
        rc=124
    fi

    local elapsed=$(( EPOCHREALTIME - start ))
    local adjusted=$(( elapsed - adjust_by ))
    (( adjusted < 0 )) && adjusted=0
    run_in_pty_elapsed="$elapsed"
    run_in_pty_adjusted="$adjusted"

    if (( adjust_by > 0 )); then
        printf '%s  elapsed = %.3fs  adjusted = %.3fs  status = %d\n' "$label" "$elapsed" "$adjusted" "$rc"
    else
        printf '%s  elapsed = %.3fs  status = %d\n' "$label" "$elapsed" "$rc"
    fi
    return "$rc"
}

average() {
    local total=0
    local value

    for value in "$@"; do
        total=$(( total + value ))
    done

    printf '%.3f' $(( total / $# ))
}

zprof_core_ms() {
    awk '
        /^[[:space:]]*[0-9]+\)/ && /__dotfiles_core-init$/ {
            print $3
            found = 1
            exit
        }
        /^[[:space:]]*[0-9]+\)/ {
            if ($3 + 0 > max) {
                max = $3 + 0
            }
        }
        END {
            if (!found && max) {
                printf "%.2f\n", max
            }
        }
    ' "$1"
}

{
    print '## Zsh startup performance'
    print
    print '```text'
    print 'zpty baseline:'
    baseline_elapsed=()
    for i in {1..10}; do
        run_in_pty "baseline-${i}" "zsh -f -ic exit"
        baseline_elapsed+=("$run_in_pty_elapsed")
    done
    baseline_average="$(average "$baseline_elapsed[@]")"
    printf 'baseline average = %.3fs\n' "$baseline_average"
    print

    print 'normal startup (wall-clock, adjusted by zpty baseline):'
    normal_elapsed=()
    normal_adjusted=()
    for i in {1..10}; do
        run_in_pty "normal-${i}" "zsh -ic exit" "$baseline_average"
        normal_elapsed+=("$run_in_pty_elapsed")
        normal_adjusted+=("$run_in_pty_adjusted")
    done
    printf 'normal average = %.3fs\n' "$(average "$normal_elapsed[@]")"
    printf 'adjusted average = %.3fs\n' "$(average "$normal_adjusted[@]")"
    print

    print 'profiled startup (zprof core total):'
    zprof_core=()
    for i in {1..10}; do
        run_in_pty "zprof-${i}" "DOTFILES_ZSHRC_MODE=perf zsh -ic exit" >/dev/null
        zprof_ms="$(zprof_core_ms "/tmp/zsh-startup-zprof-${i}.out")"
        zprof_core+=("$zprof_ms")
        printf 'zprof-%d  core = %.2fms\n' "$i" "$zprof_ms"
    done
    zprof_average_ms="$(average "$zprof_core[@]")"
    printf 'zprof core average = %.2fms (%.3fs)\n' "$zprof_average_ms" "$(( zprof_average_ms / 1000.0 ))"
    print

    print 'zprof top:'
    tr -d '\r' < /tmp/zsh-startup-zprof-10.out | sed -n '1,35p'
    print '```'
}
ZSH
'''
description = "run GitHub Actions style zsh startup performance test"

[tasks."zshrc:debug"]
run = "DOTFILES_ZSHRC_MODE=debug zsh -ic exit"
description = "run zshrc with debug mode"


# test
[tasks."test:install"]
run = "./test.sh"
description = "create test vm and run installation test"

[tasks."test:install:shell"]
run = "multipass exec dotfile-test -- zsh"
description = "attach test vm"

[tasks."test:install:clear"]
run = "./test.sh clear"
description = "delete test vm"
