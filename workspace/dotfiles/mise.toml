# dotfiles
[tasks."dotfiles:check-xdg"]
run = "$XDG_DATA_HOME/xdg-ninja/xdg-ninja.sh"
description = "check XDG directories"

[tasks."dotfiles:show-tree"]
run = "git ls-tree -dr --name-only HEAD | tree --fromfile"
description = "show directories in git repository"


# zshrc
[tasks."zshrc:perf"]
run = "zsh ./scripts/zshrc-perf"
description = "run zsh-bench against the current zshrc"

[tasks."zshrc:debug"]
run = "DOTFILES_ZSHRC_MODE=debug zsh -ic exit"
description = "run zshrc with debug mode"


# test
[tasks."test:install"]
run = "./test.sh"
description = "create test vm and run installation test"

[tasks."test:install:shell"]
run = "multipass exec dotfile-test -- zsh"
description = "attach test vm"

[tasks."test:install:clear"]
run = "./test.sh clear"
description = "delete test vm"
